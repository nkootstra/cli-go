name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name to build, for example v1.2.3"
        required: true
        default: "v0.0.0"

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve build date
        id: metadata
        shell: bash
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Build artifact
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ env.RELEASE_VERSION }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ steps.metadata.outputs.date }}
        shell: bash
        run: |
          name="devcli_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}"
          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/nkootstra/cli/internal/version.Version=${VERSION} -X github.com/nkootstra/cli/internal/version.Commit=${COMMIT} -X github.com/nkootstra/cli/internal/version.Date=${DATE}" \
            -o "dist/${name}/devcli${{ matrix.ext }}" \
            ./cmd/devcli
          tar -C "dist/${name}" -czf "dist/${name}.tar.gz" .
          sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devcli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ env.RELEASE_VERSION }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          args=(
            --title "devcli ${VERSION}"
            --generate-notes
          )

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            args+=(--target "${GITHUB_SHA}")
          fi

          gh release create "${VERSION}" dist/* "${args[@]}"
